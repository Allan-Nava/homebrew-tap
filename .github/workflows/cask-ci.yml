name: Cask CI

# Valida i cask di questo tap: stile, caricamento, install reale su macOS, audit
# online degli asset. Gira anche sui commit del bot — GoReleaser pusha con un PAT,
# quindi i workflow partono — e ogni lunedì, per accorgersi di una release i cui
# asset sono stati cancellati o di uno sha256 che non torna più.
#
# Nota tecnica: i cask devono stare dentro un tap (`brew info --cask ./Casks/x.rb`
# viene rifiutato con "Homebrew requires casks to be in a tap"), quindi ogni job
# copia il checkout in Library/Taps con scripts/ci-place-tap.sh e poi lavora per
# token (allan-nava/tap/<cask>).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # lunedì 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cask-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  # Homebrew 6+ chiede di "trustare" i tap di terze parti: in headless quel gate
  # farebbe fallire l'install.
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
  # `brew audit --online` interroga l'API di GitHub (repo, release, asset). Senza
  # token sono **60 richieste/ora per IP**, e l'IP di un runner hosted è condiviso
  # con chiunque altro stia buildando da quella macchina: con quattro cask da
  # auditare ci siamo finiti dentro davvero — `API rate limit exceeded for
  # 13.105.117.157 ... Rate limit exceeded for core resource (60 limit)`.
  #
  # Homebrew tratta l'eccezione come errore di audit (`cask/audit.rb` → `add_error
  # "exception while auditing ..."`, poi `ofail`), quindi il job va **rosso** e il
  # job `report` apre "Tap rotto" — per un motivo che col tap non c'entra nulla: un
  # audit che non ha auditato. Il GITHUB_TOKEN del run porta il limite a 1000/ora,
  # è già disponibile e qui è read-only (`permissions: contents: read`): nessun
  # secret da creare, nessun PAT che scade.
  HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Style & load
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Place the checkout as the tap
        run: scripts/ci-place-tap.sh

      - name: brew style (solo i cask)
        # Si stilano i FILE dei cask, non il tap: `brew style allan-nava/tap`
        # passerebbe anche shellcheck+shfmt sugli script, e `brew style --fix`
        # corrompe l'heredoc di render-desktop-cask.sh (verificato: tronca il
        # template). Gli script hanno il job `shellcheck` qui sotto.
        #
        # Due bucket, divisi dal marker `DO NOT EDIT` in testa al file e non da un
        # elenco di nomi: il cask di un progetto nuovo arriva col commit del bot e
        # finisce da solo in quello giusto, senza passare da qui.
        #
        # 1. Generati da GoReleaser (checkfleet, segcheck, ladder-bench): esclusioni
        #    motivate. Il file è riscritto a ogni release, quindi qui non si corregge
        #    niente — o si sistema a monte o si esclude il cop.
        #      Cask/Desc                          `desc "A fleet of..."`  → HT-2  (upstream checkfleet)
        #      Layout/EmptyLinesAroundBlockBody   template GoReleaser     → HT-22
        #      Cask/StanzaOrder                   template GoReleaser     → HT-22
        #      Cask/StanzaGrouping                template GoReleaser     → HT-22
        #      Layout/FirstArrayElementIndentation  `depends_on formula: [`  → HT-22
        # 2. Resi da noi (`render-desktop-cask.sh`): **nessuna** esclusione. Quel
        #    template è nostro, un'offense lì è un bug da correggere davvero — ed è
        #    il motivo per cui i due bucket sono separati invece di allargare la
        #    lista di `--except-cops` a tutto il tap.
        run: |
          set -euo pipefail
          tap="$(brew --repository)/Library/Taps/allan-nava/homebrew-tap"
          generated=()
          ours=()
          for f in "$tap"/Casks/*.rb; do
            if head -n 1 "$f" | grep -q 'generated by GoReleaser'; then
              generated+=("$f")
            else
              ours+=("$f")
            fi
          done
          echo "generati: ${#generated[@]} · nostri: ${#ours[@]}"
          if [ "${#generated[@]}" -gt 0 ]; then
            echo "::group::cask generati (con esclusioni)"
            brew style --except-cops \
              Cask/Desc,Layout/EmptyLinesAroundBlockBody,Cask/StanzaOrder,Cask/StanzaGrouping,Layout/FirstArrayElementIndentation \
              "${generated[@]}"
            echo "::endgroup::"
          fi
          if [ "${#ours[@]}" -gt 0 ]; then
            echo "::group::cask resi da noi (senza esclusioni)"
            brew style "${ours[@]}"
            echo "::endgroup::"
          fi

      - name: Ogni cask si carica
        run: |
          set -euo pipefail
          for f in Casks/*.rb; do
            token="$(basename "$f" .rb)"
            echo "::group::$token"
            brew info --cask "allan-nava/tap/$token"
            echo "::endgroup::"
          done

      - name: Ogni cask si carica su ogni OS/arch
        # `brew info --cask` valuta solo i rami dell'OS su cui gira: da macOS il
        # ramo `on_linux` di checkfleet.rb non viene mai caricato. Era l'unica
        # cosa che `brew test-bot --only-tap-syntax` faceva in più (workflow
        # rimosso con HT-19 perché rosso per costruzione); qui costa una riga.
        run: brew readall --aliases --os=all --arch=all allan-nava/tap

  shellcheck:
    name: Lint script & workflow
    runs-on: ubuntu-latest # shellcheck e ruby sono preinstallati, niente da installare
    steps:
      - uses: actions/checkout@v5

      # Gli script si controllano con shellcheck normale, non con `brew style`
      # sul tap: quello usa la house-style di Homebrew (shellcheck+shfmt) e il
      # suo formatter tronca l'heredoc di render-desktop-cask.sh.
      #
      # Con le impostazioni di default questo job è verde: le SC2016 sui
      # backtick markdown di backlog-sync.sh sono disattivate nel file, con la
      # motivazione accanto.
      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: Riferimenti tra job coerenti
        # Un `needs:` verso un job cancellato non dà un errore leggibile: il
        # workflow diventa invalido e il run fallisce senza job né log.
        run: scripts/check-workflows.rb

  install-cli:
    name: Install checkfleet (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # arm64 + intel: i due rami del cask generato. `macos-13` è stato ritirato
        # da GitHub e non è più un label valido — la leg non veniva schedulata,
        # restava in coda **24 ore** e poi il run finiva `cancelled` (run
        # 33404960814: 31/08 14:50 → 01/09 14:51, tutto il resto verde). Da lì
        # `macos-15-intel`, che è un runner Intel vero e non Rosetta su arm.
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Place the checkout as the tap
        run: scripts/ci-place-tap.sh

      - name: Install
        run: brew install --cask allan-nava/tap/checkfleet

      - name: La versione installata è quella del cask
        run: |
          set -euo pipefail
          want="$(brew info --json=v2 --cask allan-nava/tap/checkfleet | jq -r '.casks[0].version')"
          got="$(checkfleet version)"
          echo "cask=$want binario='$got'"
          # Non basta che sia "una versione": deve essere ESATTAMENTE quella del
          # cask, altrimenti il cask punta a una release sbagliata.
          test "$got" = "checkfleet $want"

      - name: L'attributo di quarantine è stato rimosso
        run: |
          set -euo pipefail
          bin="$(readlink -f "$(which checkfleet)")"
          if xattr -l "$bin" 2>/dev/null | grep -qi com.apple.quarantine; then
            echo "::error::$bin ha ancora com.apple.quarantine — postflight non ha funzionato"
            exit 1
          fi
          echo "nessuna quarantine ✅"

      - name: Smoke — un check gira davvero
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cf.yml" <<'YAML'
          checks:
            tcp:
              targets:
                - {name: github, address: github.com:443, tls: true}
          YAML
          # L'exit code è 0 anche con WARN/BAD (solo gli errori sistemici sono
          # diversi da 0), quindi qui si verifica solo che il modulo esegua.
          checkfleet check tcp --config "$RUNNER_TEMP/cf.yml" --output markdown

      - name: Uninstall
        if: always()
        run: brew uninstall --cask checkfleet || true

  install-desktop:
    name: Install checkfleet-desktop
    needs: lint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Place the checkout as the tap
        run: scripts/ci-place-tap.sh

      - name: Install
        run: brew install --cask allan-nava/tap/checkfleet-desktop

      - name: Il bundle è al suo posto e non è in quarantine
        run: |
          set -euo pipefail
          app="/Applications/checkfleet.app"
          test -d "$app"
          test -x "$app/Contents/MacOS/checkfleet-desktop"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist"
          if xattr -l "$app" 2>/dev/null | grep -qi com.apple.quarantine; then
            echo "::error::$app ha ancora com.apple.quarantine — postflight non ha funzionato"
            exit 1
          fi
          echo "bundle ok, nessuna quarantine ✅"

      - name: Uninstall
        if: always()
        run: brew uninstall --cask --zap checkfleet-desktop || true

  audit:
    name: Audit online
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Place the checkout as the tap
        run: scripts/ci-place-tap.sh

      - name: brew audit --cask --online
        # Scarica gli asset: è questo che scopre un url morto o uno sha256
        # sbagliato prima che ci finisca dentro un utente.
        run: |
          set -euo pipefail
          for f in Casks/*.rb; do
            token="$(basename "$f" .rb)"
            echo "::group::$token"
            brew audit --cask --online "allan-nava/tap/$token"
            echo "::endgroup::"
          done

  upstream-fixes:
    name: Fix upstream arrivati?
    # Gira sui push (cioè anche sul commit del bot che porta un cask nuovo): è
    # lì che un fix rilasciato upstream diventa visibile.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Audita il cask e apri/chiudi le issue dei fix
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          scripts/check-upstream-fixes.sh | tee fixes.tsv
          while IFS=$'\t' read -r status id msg <&3; do
            title="Fix upstream arrivato: $id"
            case "$status" in
              landed)
                # Atterrato e ancora da recepire qui: è l'unico caso che merita
                # una issue aperta.
                {
                  printf '%s\n\n' "$msg"
                  printf 'Rilevato da `scripts/check-upstream-fixes.sh` sui cask generati.\n\n'
                  printf 'Run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
                } > body.md
                scripts/gh-issue.sh ensure-open "$title" body.md backlog
                ;;
              done)
                # Atterrato E già recepito. Senza questo ramo la issue era
                # immortale: `ensure-open` riapre anche una issue chiusa a mano,
                # quindi la notifica tornava a ogni run per un lavoro già fatto.
                scripts/gh-issue.sh ensure-closed "$title" "Fix atterrato e già recepito nel tap: niente da fare."
                ;;
              *)
                scripts/gh-issue.sh ensure-closed "$title" "Non più attuale: il cask generato non contiene (più) il fix."
                ;;
            esac
          done 3< fixes.tsv

  report:
    name: Stato del tap
    # Chiude il cerchio dell'audit: se qualcosa è rosso apre UNA issue e la
    # richiude appena torna verde (niente mail perse in Actions).
    needs: [lint, shellcheck, install-cli, install-desktop, audit]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Apri/chiudi la issue di stato
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          R_LINT: ${{ needs.lint.result }}
          R_SHELLCHECK: ${{ needs.shellcheck.result }}
          R_CLI: ${{ needs['install-cli'].result }}
          R_DESKTOP: ${{ needs['install-desktop'].result }}
          R_AUDIT: ${{ needs.audit.result }}
        run: |
          set -euo pipefail
          title="Tap rotto: la CI dei cask è rossa"
          # L'elenco va in un file, non in una variabile multi-riga: dentro un
          # blocco YAML le righe successive porterebbero l'indentazione con sé e
          # nel markdown della issue diventerebbero un blocco di codice.
          : > failed.md
          for pair in "style/load:$R_LINT" "shellcheck:$R_SHELLCHECK" "install CLI:$R_CLI" \
                      "install desktop:$R_DESKTOP" "audit online:$R_AUDIT"; do
            name="${pair%%:*}"
            result="${pair##*:}"
            case "$result" in
              # `cancelled` non è un fallimento del tap: con
              # cancel-in-progress un push che ne segue un altro cancella il run
              # precedente (o una leg della matrice). Trattarlo come rosso apre
              # la issue a sproposito — visto succedere sul run 30242314155,
              # dove install-cli (macos-13) è stato cancellato e tutto il resto
              # era verde. Il run successivo dirà la verità.
              success | skipped | cancelled) ;;
              *) printf -- '- %s (`%s`)\n' "$name" "$result" >> failed.md ;;
            esac
          done
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -s failed.md ]; then
            {
              printf 'La CI del tap ha fallito su:\n\n'
              cat failed.md
              printf '\nCosa vuol dire di solito: asset di release spariti o sha256 che non torna '
              printf '(audit), cask che non si carica (style/load), postflight o versione sbagliata (install).\n\n'
              printf 'Run: %s\n' "$run_url"
            } > body.md
            scripts/gh-issue.sh ensure-open "$title" body.md tap-broken
            exit 0
          fi
          scripts/gh-issue.sh ensure-closed "$title" "CI verde di nuovo: $run_url"
